[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compose-mp = "1.12.2"
material3 = "1.12.0-alpha03"
material-icons = "1.7.3"
lifecycle = "2.11.0"
navigation = "2.10.0"
sqldelight = "2.4.1"
litert = "2.4.0"
camerax = "1.7.0"
splashscreen = "1.2.0"
activity = "1.13.0"
work = "2.12.0"
koin = "4.2.2"
supabase = "3.9.0"
ktor = "3.6.0"
serialization = "1.13.0"
coroutines = "1.11.0"
coil = "3.6.3"
exif = "1.4.2"
junit = "4.13.2"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "material-icons" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-mp" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-mp" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-mp" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-mp" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-mp" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-workmanager = { module = "io.insert-koin:koin-androidx-workmanager" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
