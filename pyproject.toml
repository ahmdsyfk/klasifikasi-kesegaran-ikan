[project]
name = "klasifikasi-kesegaran-ikan"
version = "0.1.0"
description = "Perbandingan efisiensi VGG16, ResNet50, dan InceptionV3 untuk klasifikasi tingkat kesegaran ikan berdasarkan citra mata dengan inferensi di ponsel"
authors = [{ name = "Ahmad Safrudin Kurniawan" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "pillow>=11.0",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU NVIDIA hanya didukung TensorFlow di Linux/WSL2 (bukan Windows native).
cuda = ["tensorflow[and-cuda]==2.21.0; sys_platform == 'linux'"]
roi = [
    "opencv-python-headless>=5.1.0.95",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.1",
]

[project.scripts]
fishfresh = "fishfresh.cli:main"

[dependency-groups]
dev = ["jupyterlab>=4.2", "ipykernel>=6.29", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "fishfresh"
